# The site itself is pre-generated by build.py, so Jekyll has nothing to do
# with it. Jekyll is still left on because the archived course notes under
# archive/ are Markdown and rely on it to become HTML pages.
#
# What Jekyll must not see is the machinery that builds the site. docs/ in
# particular holds planning notes whose fenced code blocks contain Jinja tags
# such as {% raw %}{% macro %}{% endraw %}; Liquid parses Markdown regardless
# of fences, does not know that tag, and fails the whole build on it.
exclude:
  - build.py
  - content/
  - docs/
  - templates/
  - tests/
  - tools/
  - scripts/
  - cv.tex
  - pyproject.toml
  - poetry.lock
  - pytest.ini
  - node_modules/
  - vendor/
